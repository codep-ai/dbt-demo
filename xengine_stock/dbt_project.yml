# Cross-engine stock demo: ONE dbt-core project, several engines, ONE copy of the data (Apache Iceberg on S3).
#   producer  -> built BY Athena  into Glue database `stock_common`  (tag: producer)
#   consumers -> built BY Snowflake (and later Databricks) on top of those same Iceberg tables (tag: consumer_<engine>)
# Run a slice per engine:   dbt build --target athena --select tag:producer
#                           dbt build --target snowflake --select tag:consumer_snowflake
name: stock_xengine
version: "1.0.0"
config-version: 2
profile: datapai_xengine
model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

tests:
  stock_xengine:
    +tags: ["producer_consumer_demo"]

# Every model and test in this project carries `producer_consumer_demo`, so the whole data-producer-to-consumer demo
# can be selected, documented and traced as one unit across engines:   dbt ls --select tag:producer_consumer_demo
models:
  stock_xengine:
    +tags: ["producer_consumer_demo"]
    producer_athena:
      +enabled: "{{ target.type == 'athena' }}"
      +tags: ["producer", "stock_common", "xengine"]
      +materialized: table
      +table_type: iceberg
      +format: parquet
      +meta: {engine: athena, role: producer}
    consumer_snowflake:
      +enabled: "{{ target.type == 'snowflake' }}"
      +tags: ["consumer_snowflake", "xengine"]
      +materialized: table
      +meta: {engine: snowflake, role: consumer}
