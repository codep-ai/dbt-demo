# Project settings for datapai-platform-be/scripts/xengine.py. All project-specific names live here, none in code.
pipeline_id: stock_xengine        # key in datapai.sys_ai_column_lineage / sys_ai_lineage_node
region: ap-southeast-2
snowflake: {profile: datapai_snowflake_svc, target: prod}

# Snowflake-written Iceberg -> Glue pointers, so Athena / Spark can read them (raw inputs of the producer)
glue_sync:
  - {database: DATAPAI, schemas: [STOCK], glue_database: stock_raw_xengine}

# Glue Iceberg written by the producer engine -> read-only Snowflake pointers, so the Snowflake consumer can read them.
# Files must sit under the external volume's base URL. Re-run after every producer build.
snowflake_sync:
  - glue_database: stock_common
    database: DATAPAI
    schema: STOCK_COMMON
    external_volume: DATAPAI_S3_VOL
    catalog_integration: CFD_OBJ_CAT          # generic OBJECT_STORE / ICEBERG integration, despite the name
    volume_base_url: s3://codepais3/stock/bronze/
    # glue = tables backed by the GLUE catalog integration with AUTO_REFRESH. Tested 2026-09-21: auto-refresh follows a table only while
    # its Iceberg UUID is stable. These producer models are full-rebuild `table` models (DROP + CREATE = new UUID), so STILL run
    # snowflake-sync after each producer build; it re-binds. Incremental/merge producers need no sync.
    # pointer = snapshot pointers via the object-store integration (works with zero account privileges; needs a sync each build).
    mode: glue
    glue_catalog_integration: GLUE_STOCK_COMMON

# Reader grants for the Databricks federation role (a re-created Snowflake pointer table loses its grants).
reader_grants:
  - {roles: [DATABRICKS_READER], schemas: [DATAPAI.STOCK_COMMON, DATAPAI.STOCK_CONSUMER]}

# Lineage is computed per engine (its own manifest + catalog, own SQL dialect) and stitched at the shared Iceberg tables.
# Order = producer first, then consumers.
engines:
  - {engine: athena,    dialect: athena,    target_dir: target_athena}
  - {engine: snowflake, dialect: snowflake, target_dir: target_snowflake}
  - {engine: databricks, dialect: databricks, target_dir: target_databricks}   # skipped until its artefacts exist
lineage_out: target_snowflake/lineage_xengine.json
