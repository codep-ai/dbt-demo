version: 2
models:
  - name: feat_price_momentum
    description: 20-day momentum and volume features per ticker. Built by Databricks on Athena-produced common tables.
    columns:
      - {name: ticker, tests: [not_null]}
      - {name: exchange, tests: [not_null]}
      - {name: sector}
      - {name: trade_date, tests: [not_null]}
      - {name: currency_code}
      - {name: close_usd}
      - {name: return_20d}
      - {name: volume_vs_20d_avg}
  - name: feat_exchange_monthly
    description: Monthly aggregates per exchange and currency. Built by Databricks on a Snowflake-produced mart (Snowflake-managed Iceberg).
    columns:
      - {name: exchange, tests: [not_null]}
      - {name: currency_code, tests: [not_null]}
      - {name: month_start, tests: [not_null]}
      - {name: tickers}
      - {name: avg_close_usd}
      - {name: total_volume}
