version: 2
models:
  - name: stg_closed_dates
    description: 'Market holidays, grain: exchange, closed_date.'
    config:
      tags:
        - staging
        - stock_ai
      meta:
        column_lineage_dialect: snowflake
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - exchange
              - closed_date
    columns:
      - name: exchange
        description: The market code or exchange identifier.
        config:
          meta:
            lineage:
              - source:stock_market_closed_dates.market_code
            sensitivity: PUBLIC
      - name: closed_date
        description: The date the market was closed.
        tests:
          - not_null
        config:
          meta:
            lineage:
              - source:stock_market_closed_dates.closed_date
            sensitivity: PUBLIC