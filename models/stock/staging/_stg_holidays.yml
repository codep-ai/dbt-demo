version: 2
models:
  - name: stg_holidays
    description: Market closed dates.
    config:
      tags:
        - staging
        - stock_ai
      meta:
        column_lineage_dialect: snowflake
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - market_code
              - closed_date
    columns:
      - name: market_code
        description: The code identifying the specific stock market.
        config:
          meta:
            lineage:
              - source:stock_market_closed_dates.market_code
            sensitivity: PUBLIC
      - name: closed_date
        description: The date on which the market was closed.
        tests:
          - not_null
        config:
          meta:
            lineage:
              - source:stock_market_closed_dates.closed_date
            sensitivity: PUBLIC