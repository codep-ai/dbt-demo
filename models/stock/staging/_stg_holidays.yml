version: 2
models:
- name: stg_holidays
  description: Market closed dates.
  config:
    tags:
    - staging
    - stock_ai
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - market_code
      - closed_date
  columns:
  - name: market_code
    description: The code identifying the specific stock market.
  - name: closed_date
    description: The date on which the market was closed.
    tests:
    - not_null
