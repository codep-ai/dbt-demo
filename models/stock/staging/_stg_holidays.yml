version: 2
models:
- name: stg_holidays
  description: Market closed dates.
  config:
    tags:
    - staging
    - stock_ai
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - market_code
      - closed_date
  columns:
  - name: market_code
    description: The code identifying the specific stock market.
    meta:
      lineage:
      - source:stock_market_closed_dates.market_code
      sensitivity: PUBLIC
  - name: closed_date
    description: The date on which the market was closed.
    tests:
    - not_null
    meta:
      lineage:
      - source:stock_market_closed_dates.closed_date
      sensitivity: PUBLIC
  meta:
    column_lineage_dialect: snowflake
