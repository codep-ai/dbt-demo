version: 2
models:
- name: stg_prices
  description: 'Daily OHLCV prices, grain: ticker, exchange, trade_date.'
  config:
    tags:
    - staging
    - stock_ai
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - ticker
      - trade_date
      - exchange
  columns:
  - name: ticker_raw
    description: The original ticker string from the source.
    meta:
      lineage:
      - source:prices.ticker
      sensitivity: PUBLIC
  - name: ticker
    description: Conformed ticker symbol (e.g., AAPL).
    tests:
    - not_null
    meta:
      lineage:
      - source:prices.ticker
      sensitivity: PUBLIC
  - name: trade_date
    description: The date of the price record.
    meta:
      lineage:
      - source:prices.trade_date
      sensitivity: PUBLIC
  - name: open
    description: Opening price.
    meta:
      lineage:
      - source:prices.open
      sensitivity: PUBLIC
  - name: high
    description: Highest price during the session.
    meta:
      lineage:
      - source:prices.high
      sensitivity: PUBLIC
  - name: low
    description: Lowest price during the session.
    meta:
      lineage:
      - source:prices.low
      sensitivity: PUBLIC
  - name: close
    description: Closing price.
    meta:
      lineage:
      - source:prices.close
      sensitivity: PUBLIC
  - name: volume
    description: Trading volume.
    meta:
      lineage:
      - source:prices.volume
      sensitivity: PUBLIC
  - name: adj_close
    description: Adjusted closing price.
    meta:
      lineage:
      - source:prices.adj_close
      sensitivity: PUBLIC
  - name: exchange
    description: The exchange where the ticker is traded.
    meta:
      lineage:
      - source:prices.exchange
      sensitivity: PUBLIC
  meta:
    column_lineage_dialect: snowflake
