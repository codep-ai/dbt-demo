version: 2
models:
  - name: prices
    description: 'Daily OHLCV prices for US and ASX stocks. Snowflake Managed Iceberg table — Snowflake writes Iceberg format to s3://${S3_BUCKET_STOCK}/stock/bronze/prices/. Data loaded by scripts/sync_snowflake_iceberg.py via S3 raw stage.

      '
    config:
      tags:
        - iceberg
        - daily
        - ohlcv
        - stock
      meta:
        column_lineage_dialect: snowflake
    columns:
      - name: ticker
        description: Stock ticker symbol (e.g. AAPL, BHP.AX)
        tests:
          - not_null
        config:
          meta:
            lineage: []
            sensitivity: PUBLIC
      - name: trade_date
        description: Trading date (YYYY-MM-DD)
        tests:
          - not_null
        config:
          meta:
            lineage: []
            sensitivity: PUBLIC
      - name: open
        description: Opening price
        config:
          meta:
            lineage: []
            sensitivity: PUBLIC
      - name: high
        description: Intraday high price
        config:
          meta:
            lineage: []
            sensitivity: PUBLIC
      - name: low
        description: Intraday low price
        config:
          meta:
            lineage: []
            sensitivity: PUBLIC
      - name: close
        description: Closing price
        tests:
          - not_null
        config:
          meta:
            lineage: []
            sensitivity: PUBLIC
      - name: adj_close
        description: Dividend/split-adjusted closing price
        config:
          meta:
            lineage: []
            sensitivity: PUBLIC
      - name: volume
        description: Volume traded
        config:
          meta:
            lineage: []
            sensitivity: PUBLIC
      - name: exchange
        description: Exchange code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - US
                  - ASX
        config:
          meta:
            lineage: []
            sensitivity: PUBLIC
      - name: source
        description: Data source identifier
        tests:
          - accepted_values:
              arguments:
                values:
                  - yahoo
                  - polygon
        config:
          meta:
            lineage: []
            sensitivity: PUBLIC
  - name: ohlcv_intraday
    description: '30-minute OHLCV intraday bars for US and ASX stocks. Snowflake Managed Iceberg table — Snowflake writes Iceberg format to s3://${S3_BUCKET_STOCK}/stock/bronze/ohlcv_intraday/. Data loaded by scripts/sync_snowflake_iceberg.py via S3 raw stage.

      '
    config:
      tags:
        - iceberg
        - intraday
        - ohlcv
        - stock
      meta:
        column_lineage_dialect: snowflake
    columns:
      - name: ticker
        description: Stock ticker symbol
        tests:
          - not_null
        config:
          meta:
            lineage: []
            sensitivity: PUBLIC
      - name: ts
        description: Bar open timestamp in UTC (TIMESTAMP_TZ)
        tests:
          - not_null
        config:
          meta:
            lineage: []
            sensitivity: PUBLIC
      - name: open
        description: Open price for the bar
        config:
          meta:
            lineage: []
            sensitivity: PUBLIC
      - name: high
        description: High price for the bar
        config:
          meta:
            lineage: []
            sensitivity: PUBLIC
      - name: low
        description: Low price for the bar
        config:
          meta:
            lineage: []
            sensitivity: PUBLIC
      - name: close
        description: Close price for the bar
        tests:
          - not_null
        config:
          meta:
            lineage: []
            sensitivity: PUBLIC
      - name: volume
        description: Volume traded in the bar
        config:
          meta:
            lineage: []
            sensitivity: PUBLIC
      - name: exchange
        description: Exchange code
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - US
                  - ASX
        config:
          meta:
            lineage: []
            sensitivity: PUBLIC
      - name: source
        description: Data source identifier
        tests:
          - accepted_values:
              arguments:
                values:
                  - yahoo
                  - polygon
        config:
          meta:
            lineage: []
            sensitivity: PUBLIC