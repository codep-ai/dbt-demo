version: 2
models:
- name: fct_daily_price
  description: Daily price fact with local and USD values.
  config:
    tags:
    - fact
    - stock_ai
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - ticker
      - exchange
      - trade_date
  columns:
  - name: ticker_key
    description: Surrogate key for the ticker.
    tests:
    - not_null
    - relationships:
        to: ref('dim_ticker')
        field: ticker_key
  - name: exchange_key
    description: Surrogate key for the exchange.
  - name: ticker
    description: Stock ticker symbol.
  - name: exchange
    description: Exchange code.
  - name: trade_date
    description: The date of the trade.
  - name: close
    description: Closing price in local currency.
  - name: close_usd
    description: Closing price in USD.
  - name: volume
    description: Trading volume.
  - name: sma_5
    description: 5-day simple moving average.
  - name: sma_200
    description: 200-day simple moving average.
  - name: volatility_20d
    description: 20-day price volatility.
  - name: rsi_14
    description: 14-day Relative Strength Index.
  - name: obv
    description: On-Balance Volume.
  - name: obv_trend
    description: Trend direction of OBV.
  - name: pivot_pp
    description: Pivot point price level.
  - name: kdj_k
    description: K-line value from KDJ indicator.
