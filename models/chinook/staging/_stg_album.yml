version: 2
models:
  - name: stg_album
    description: Contains list of album
    columns:
      - name: album_id
        description: Album identifier key
        tests:
          - not_null
          - unique
        config:
          meta:
            lineage:
              - album.album_id
            sensitivity: PUBLIC
      - name: album_title
        description: Title of the album
        tests:
          - not_null
        config:
          meta:
            lineage:
              - album.title
            sensitivity: PUBLIC
      - name: artist_id
        description: Artist identifier key
        tests:
          - not_null
        config:
          meta:
            lineage:
              - album.artist_id
            sensitivity: PUBLIC
    config:
      meta:
        column_lineage_dialect: snowflake
        datapai:
          ai_access_level: approved
          ai_enabled: true