version: 2
models:
- name: stg_invoice_line
  description: Contains list of invoice lines
  columns:
  - name: invoice_line_id
    description: Invoice line identifier key
    tests:
    - not_null
    - unique
    meta:
      lineage:
      - invoiceline.invoice_line_id
      sensitivity: PUBLIC
  - name: invoice_id
    description: Invoice identifier key
    tests:
    - not_null
    meta:
      lineage:
      - invoiceline.invoice_id
      sensitivity: PUBLIC
  - name: track_id
    description: Track identifier key
    tests:
    - not_null
    meta:
      lineage:
      - invoiceline.track_id
      sensitivity: PUBLIC
  - name: track_unit_price
    description: Price of the track
    tests:
    - not_null
    meta:
      lineage:
      - invoiceline.unit_price
      sensitivity: PUBLIC
  - name: track_quantity
    description: Quantity of the track
    tests:
    - not_null
    meta:
      lineage:
      - invoiceline.quantity
      sensitivity: PUBLIC
  meta:
    column_lineage_dialect: snowflake
    datapai:
      ai_access_level: restricted
      ai_enabled: true
