version: 2
models:
- name: stg_artist
  description: Contains list of album
  columns:
  - name: artist_id
    description: Artist identifier key
    tests:
    - not_null
    - unique
    meta:
      lineage:
      - artist.artist_id
      sensitivity: PUBLIC
  - name: artist_name
    description: Name of the artist
    tests:
    - not_null
    meta:
      lineage:
      - artist.name
      sensitivity: PUBLIC
  meta:
    column_lineage_dialect: snowflake
    datapai:
      ai_access_level: restricted
      ai_enabled: true
