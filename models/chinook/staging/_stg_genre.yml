version: 2
models:
- name: stg_genre
  description: Contains list of genres
  columns:
  - name: genre_id
    description: Genre identifier key
    tests:
    - not_null
    - unique
    meta:
      lineage:
      - genre.genre_id
      sensitivity: PUBLIC
  - name: genre_name
    description: Name of the genre
    tests:
    - not_null
    meta:
      lineage:
      - genre.name
      sensitivity: PUBLIC
  meta:
    column_lineage_dialect: snowflake
    datapai:
      ai_access_level: approved
      ai_enabled: true
