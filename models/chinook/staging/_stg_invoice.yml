version: 2
models:
- name: stg_invoice
  description: Contains list of invoice lines
  columns:
  - name: invoice_id
    description: Invoice identifier key
    tests:
    - not_null
    - unique
    meta:
      lineage:
      - invoice.invoice_id
      sensitivity: PUBLIC
  - name: customer_id
    description: Customer identifier key
    tests:
    - not_null
    meta:
      lineage:
      - invoice.customer_id
      sensitivity: PUBLIC
  - name: invoice_date
    description: Date of the invoice
    tests:
    - not_null
    meta:
      lineage:
      - invoice.invoice_date
      sensitivity: PUBLIC
  - name: invoice_billing_address
    description: Address of the billing
    tests:
    - not_null
    meta:
      lineage:
      - invoice.billing_address
      sensitivity: PUBLIC
  - name: invoice_billing_city
    description: City of the billing address
    tests:
    - not_null
    meta:
      lineage:
      - invoice.billing_city
      sensitivity: PUBLIC
  - name: invoice_billing_state
    description: State of the billing address
    meta:
      lineage:
      - invoice.billing_state
      sensitivity: PUBLIC
  - name: invoice_billing_country
    description: Country of the billing address
    tests:
    - not_null
    meta:
      lineage:
      - invoice.billing_country
      sensitivity: PUBLIC
  - name: invoice_billing_postal_code
    description: Postal code of the billing address
    meta:
      lineage:
      - invoice.billing_postal_code
      sensitivity: PUBLIC
  - name: invoice_total
    description: Total amount of the billing
    tests:
    - not_null
    meta:
      lineage:
      - invoice.total
      sensitivity: PUBLIC
  meta:
    column_lineage_dialect: snowflake
    datapai:
      ai_access_level: restricted
      ai_enabled: true
