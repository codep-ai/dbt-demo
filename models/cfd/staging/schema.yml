version: 2
models:
- name: stg_ticks_fx
  description: Staging view over lake.fct_tick_fx — 1:1 with source, no derived fields
  columns:
  - name: symbol
    tests:
    - not_null
    meta:
      lineage:
      - source:src_tick_fx.symbol
      sensitivity: PUBLIC
  - name: ts_utc
    tests:
    - not_null
    meta:
      lineage:
      - source:src_tick_fx.ts_utc
      sensitivity: PUBLIC
  - name: asset_class
    description: Always 'fx' for this staging view
    meta:
      lineage: []
      sensitivity: PUBLIC
  meta:
    column_lineage_dialect: snowflake
- name: stg_ticks_crypto
  description: Staging view over lake.fct_tick_crypto. Crypto's 'session' field is renamed to 'exchange_region' to reflect
    24/7 trading semantics.
  columns:
  - name: symbol
    tests:
    - not_null
    meta:
      lineage:
      - source:src_tick_crypto.symbol
      sensitivity: PUBLIC
  - name: ts_utc
    tests:
    - not_null
    meta:
      lineage:
      - source:src_tick_crypto.ts_utc
      sensitivity: PUBLIC
  - name: exchange_region
    description: GLOBAL / ASIA / LONDON / NY — where the price was quoted, not a trading session
    meta:
      lineage:
      - source:src_tick_crypto.session
      sensitivity: PUBLIC
  meta:
    column_lineage_dialect: snowflake
- name: stg_ticks_index
  description: Staging view over lake.fct_tick_index — equity indices
  columns:
  - name: symbol
    tests:
    - not_null
    meta:
      lineage:
      - source:src_tick_index.symbol
      sensitivity: PUBLIC
  - name: ts_utc
    tests:
    - not_null
    meta:
      lineage:
      - source:src_tick_index.ts_utc
      sensitivity: PUBLIC
  meta:
    column_lineage_dialect: snowflake
- name: stg_ticks_commodity
  description: Staging view over lake.fct_tick_commodity — energy + ag commodities (gold is in FX)
  columns:
  - name: symbol
    tests:
    - not_null
    meta:
      lineage:
      - source:src_tick_commodity.symbol
      sensitivity: PUBLIC
  - name: ts_utc
    tests:
    - not_null
    meta:
      lineage:
      - source:src_tick_commodity.ts_utc
      sensitivity: PUBLIC
  meta:
    column_lineage_dialect: snowflake
