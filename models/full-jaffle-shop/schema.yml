version: 2
models:
- name: customers
  meta:
    joins:
    - join: membership
      hidden: true
      sql_on: ${customers.customer_id} = ${membership.customer_id}
    - join: plan
      sql_on: ${membership.plan_id} = ${plan.id}
    column_lineage_dialect: snowflake
    datapai:
      contains_pii: true
      sensitivity_level: confidential
      default_answer_mode: full
  description: '# Customers


    This table has basic information about a customer, as well as some derived

    facts based on a customer''s orders

    '
  columns:
  - name: customer_id
    description: This is a unique identifier for a customer
    tests:
    - unique
    - not_null
    meta:
      lineage:
      - stg_customers.customer_id
      sensitivity: PUBLIC
  - name: first_name
    description: Customer's first name. PII.
    meta:
      dimension:
        type: string
        urls:
        - label: URL from value
          url: https://example.com/company/${value.formatted | url_encode }
        - label: URL from row value
          url: https://example.com/company/${row.customers.customer_id.raw | url_encode }
        - label: Invalid URL with bad reference
          url: https://example.com/company/${row.customer_id.raw | url_encode }
      lineage:
      - stg_customers.first_name
      sensitivity: PII_MEDIUM
      datapai:
        pii: direct
        security_class: confidential
        masking_rule: hash
        answer_mode: full
        allowed_in_output: true
        allowed_in_export: true
        ai_sensitivity_source: datapai-ai-etl column lineage
  - name: last_name
    description: Customer's last name. PII.
    meta:
      lineage:
      - stg_customers.last_name
      sensitivity: PII_MEDIUM
      datapai:
        pii: direct
        security_class: confidential
        masking_rule: hash
        answer_mode: full
        allowed_in_output: true
        allowed_in_export: true
        ai_sensitivity_source: datapai-ai-etl column lineage
  - name: age
    description: Customer's age
    meta:
      dimension:
        type: number
        required_attributes:
          is_admin: 'true'
      metrics:
        average_age:
          type: average
          description: Average age of customers
      lineage: []
      sensitivity: PUBLIC
  - name: created
    description: Timestamp (UTC) when customer was created
    meta:
      metrics:
        date_of_first_created_customer:
          type: min
        date_of_most_recent_created_customer:
          type: max
      lineage:
      - stg_customers.created
      sensitivity: PUBLIC
  - name: first_order
    description: Date of the customers first order
    meta:
      dimension:
        hidden: true
      lineage:
      - stg_orders.order_date
      sensitivity: PUBLIC
  - name: most_recent_order
    description: Date of the customers most recent order
    meta:
      dimension:
        hidden: true
      lineage:
      - stg_orders.order_date
      sensitivity: PUBLIC
  - name: days_since_last_order
    description: Number of days since the customers last order
    meta:
      dimension:
        hidden: true
      lineage:
      - stg_orders.order_date
      sensitivity: PUBLIC
  - name: days_between_created_and_first_order
    description: Number of days between the customer being created and making their first order
    meta:
      dimension:
        hidden: true
      lineage:
      - stg_customers.created
      - stg_orders.order_date
      sensitivity: PUBLIC
  - name: number_of_orders
    description: ''
    meta:
      dimension:
        hidden: true
      lineage:
      - stg_orders.order_id
      sensitivity: PUBLIC
  - name: customer_lifetime_value
    description: ''
    meta:
      dimension:
        hidden: true
      lineage:
      - stg_payments.amount
      sensitivity: PUBLIC
- name: orders
  description: 'This table has basic information about orders, as well as some derived

    facts based on payments


    {{ doc("orders_status") }}

    '
  meta:
    joins:
    - join: customers
      sql_on: ${customers.customer_id} = ${orders.customer_id}
    column_lineage_dialect: snowflake
  columns:
  - name: order_id
    tests:
    - unique
    - not_null
    description: This is a unique identifier for an order
    meta:
      metrics:
        unique_order_count:
          type: count_distinct
        completed_or_shipped_order_count:
          label: Completed or Shipped Order Count
          type: count_distinct
          filters:
          - status:
            - completed
            - shipped
      lineage:
      - stg_orders.order_id
      sensitivity: PUBLIC
  - name: is_completed
    description: Boolean indicating if status is completed
    meta:
      metrics:
        fulfillment_rate:
          type: average
          format: percent
          round: 1
          sql: CASE WHEN ${is_completed} THEN 1 ELSE 0 END
          show_underlying_values:
          - amount
          - customers.first_name
      lineage:
      - stg_orders.status
      sensitivity: PUBLIC
  - name: customer_id
    description: Foreign key to the customers table
    tests:
    - not_null
    - relationships:
        to: ref('customers')
        field: customer_id
    meta:
      lineage:
      - stg_orders.customer_id
      sensitivity: PUBLIC
  - name: order_date
    description: Date (UTC) that the order was placed
    meta:
      dimension:
        type: date
        time_intervals:
        - DAY
        - WEEK
        - MONTH
        - YEAR
      metrics:
        date_of_first_order:
          type: min
        date_of_most_recent_order:
          type: max
      lineage:
      - stg_orders.order_date
      sensitivity: PUBLIC
  - name: status
    description: '{{ doc("orders_status") }}'
    tests:
    - accepted_values:
        values:
        - placed
        - shipped
        - completed
        - return_pending
        - returned
    meta:
      lineage:
      - stg_orders.status
      sensitivity: PUBLIC
  - name: amount
    description: Total amount (USD) of the order
    tests:
    - not_null
    meta:
      metrics:
        average_order_size:
          type: average
          format: usd
          round: 2
        total_order_amount:
          type: sum
          format: usd
          round: 2
        total_completed_order_amount:
          type: sum
          format: usd
          round: 2
          filters:
          - is_completed: 'true'
        total_completed_order_amount_eur:
          type: sum
          format: eur
          filters:
          - is_completed: 'true'
        total_non_completed_order_amount:
          type: number
          format: usd
          round: 2
          sql: ${total_order_amount}-${total_completed_order_amount}
      dimension:
        hidden: true
      lineage:
      - stg_payments.amount
      sensitivity: PUBLIC
  - name: credit_card_amount
    description: Amount of the order (AUD) paid for by credit card
    tests:
    - not_null
    meta:
      dimension:
        hidden: true
      lineage:
      - stg_payments.payment_method
      - stg_payments.amount
      sensitivity: PUBLIC
  - name: coupon_amount
    description: Amount of the order (AUD) paid for by coupon
    tests:
    - not_null
    meta:
      dimension:
        hidden: true
      lineage:
      - stg_payments.payment_method
      - stg_payments.amount
      sensitivity: PUBLIC
  - name: bank_transfer_amount
    description: Amount of the order (AUD) paid for by bank transfer
    tests:
    - not_null
    meta:
      dimension:
        hidden: true
      lineage:
      - stg_payments.payment_method
      - stg_payments.amount
      sensitivity: PUBLIC
  - name: gift_card_amount
    description: Amount of the order (AUD) paid for by gift card
    tests:
    - not_null
    meta:
      dimension:
        hidden: true
      lineage:
      - stg_payments.payment_method
      - stg_payments.amount
      sensitivity: PUBLIC
- name: payments
  description: This table has information about individual payments
  meta:
    joins:
    - join: orders
      sql_on: ${orders.order_id} = ${payments.order_id}
    - join: customers
      sql_on: ${customers.customer_id} = ${orders.customer_id}
    column_lineage_dialect: snowflake
  columns:
  - name: payment_id
    description: This is a unique identifier for a payment
    meta:
      metrics:
        unique_payment_count:
          type: count_distinct
          description: count of all payments
      lineage:
      - stg_payments.payment_id
      sensitivity: PUBLIC
  - name: order_id
    description: Foreign key to the orders table
    meta:
      lineage:
      - stg_payments.order_id
      sensitivity: PUBLIC
  - name: payment_method
    description: Method of payment used, for example credit card
    meta:
      lineage:
      - stg_payments.payment_method
      sensitivity: PUBLIC
  - name: amount
    description: Total amount (AUD) of the individual payment
    meta:
      metrics:
        total_revenue:
          type: sum
          description: Sum of all payments
      lineage:
      - stg_payments.amount
      sensitivity: PUBLIC
