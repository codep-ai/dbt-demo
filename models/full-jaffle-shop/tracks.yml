version: 2
models:
- name: tracks
  columns:
  - name: user_id
    description: ''
    meta:
      dimension:
        type: string
      lineage:
      - raw_tracks.user_id
      sensitivity: PUBLIC
  - name: id
    description: ''
    meta:
      dimension:
        type: string
      lineage:
      - raw_tracks.id
      sensitivity: PUBLIC
  - name: timestamp
    description: ''
    meta:
      dimension:
        label: Timestamp
        type: timestamp
        time_intervals:
        - RAW
        - MILLISECOND
        - SECOND
        - MINUTE
        - HOUR
        - DAY
        - DAY_OF_WEEK_INDEX
        - DAY_OF_WEEK_NAME
        - DAY_OF_MONTH_NUM
        - DAY_OF_YEAR_NUM
        - WEEK
        - WEEK_NUM
        - MONTH
        - MONTH_NUM
        - MONTH_NAME
        - QUARTER
        - QUARTER_NUM
        - QUARTER_NAME
        - YEAR
        - YEAR_NUM
        - HOUR_OF_DAY_NUM
        - MINUTE_OF_HOUR_NUM
      lineage:
      - raw_tracks.timestamp
      sensitivity: PUBLIC
  - name: event
    description: ''
    meta:
      dimension:
        type: string
      metrics:
        unique_event_count:
          type: count_distinct
        event_count:
          type: count
      lineage:
      - raw_tracks.event
      sensitivity: PUBLIC
  - name: event_text
    description: ''
    meta:
      dimension:
        type: string
      lineage:
      - raw_tracks.event_text
      sensitivity: PUBLIC
  - name: context_app_version
    description: ''
    meta:
      dimension:
        type: string
      lineage:
      - raw_tracks.context_app_version
      sensitivity: PUBLIC
  meta:
    column_lineage_dialect: snowflake
